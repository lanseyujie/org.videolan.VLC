app-id: org.videolan.VLC
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: vlc

finish-args:
  - --require-version=1.12.0
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all
  - --filesystem=host
  - --filesystem=xdg-run/gvfs
  - --talk-name=org.freedesktop.PowerManagement
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.freedesktop.secrets
  - --talk-name=org.kde.kwalletd6
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.mpris.MediaPlayer2.vlc

rename-appdata-file: org.videolan.vlc.appdata.xml
rename-desktop-file: vlc.desktop
rename-icon: vlc
copy-icon: true
separate-locales: false

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/aclocal
  - /share/doc
  - /share/gtk-doc
  - /share/info
  - /share/man
  - '*.a'
  - '*.la'

cleanup-commands:
  - rm -rf /app/contrib
  - rm -f /app/lib/vlc/plugins/plugins.dat
  - TZ=UTC find /app/lib/vlc/plugins -exec touch -t 197001010000 {} \;
  - /app/libexec/vlc/vlc-cache-gen /app/lib/vlc/plugins

build-options:
  build-args:
    - --share=network
    - --bind-mount=/run/vlc-contrib-tarballs=/workspace/.cache/vlc-contrib-tarballs
  env:
    BUILDCC: gcc
    QMAKE6: /usr/bin/qmake
    V: '1'
  prepend-path: /app/contrib/bin
  prepend-pkg-config-path: /app/contrib/lib/pkgconfig
  cflags: -I/app/contrib/include -L/app/contrib/lib
  cxxflags: -I/app/contrib/include -L/app/contrib/lib

modules:
  - name: vlc-contrib
    buildsystem: simple
    build-commands:
      - |
        set -eux
        jobs="${FLATPAK_BUILDER_N_JOBS:-1}"

        cd extras/tools
        ./bootstrap
        make -j "$jobs"
        cd ../..
        export PATH="$PWD/extras/tools/build/bin:$PATH"

        mkdir -p contrib/linux
        cd contrib/linux
        ../bootstrap \
          --prefix=/app/contrib \
          --enable-ffmpeg \
          --enable-dav1d \
          --enable-fluidlite \
          --disable-fluid \
          --disable-chromaprint \
          --enable-libdsm \
          --enable-dvdcss
        make TARBALLS=/run/vlc-contrib-tarballs list
        make -j "$jobs" TARBALLS=/run/vlc-contrib-tarballs fetch
        make -j "$jobs" TARBALLS=/run/vlc-contrib-tarballs -k || \
          make -j1 TARBALLS=/run/vlc-contrib-tarballs
        cd ../..

        install -Dm755 \
          contrib/linux/protoc/vlc_native/protoc \
          /app/contrib/bin/protoc
    sources:
      - type: git
        url: https://github.com/videolan/vlc.git
        commit: c52356f14ee57e3002066ef8834591d1cbfd479d

  - name: vlc
    buildsystem: simple
    build-commands:
      - |
        set -eux
        jobs="${FLATPAK_BUILDER_N_JOBS:-1}"

        export PROTOC=/app/contrib/bin/protoc
        ./bootstrap
        ./configure \
          --prefix=/app \
          --enable-merge-ffmpeg \
          --enable-extra-checks \
          --disable-libplacebo \
          --disable-qt-qml-cache
        make -j "$jobs"
        make -j1 install
    post-install:
      - mv /app/bin/vlc /app/bin/vlc.bin
      - install -Dm755 vlc.sh /app/bin/vlc
      - echo 'StartupWMClass=VLC' >> /app/share/applications/vlc.desktop
      - sed -i 's/^Icon=vlc$/Icon=org.videolan.VLC/' /app/share/applications/vlc*.desktop
      - rm -f /app/share/icons/hicolor/16x16/apps/vlc.xpm /app/share/icons/hicolor/32x32/apps/vlc.xpm
    sources:
      - type: git
        url: https://github.com/videolan/vlc.git
        commit: c52356f14ee57e3002066ef8834591d1cbfd479d
      - type: patch
        path: 0001-qt-fix-moc-include-directory-extraction.patch
      - type: patch
        path: 0002-qt-avoid-rhi-probe-self-deadlock.patch
      - type: file
        path: vlc.sh
